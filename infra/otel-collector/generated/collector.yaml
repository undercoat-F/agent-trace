receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  file_log/claude-hook:
    include:
      - /var/log/agents/claude/hook-log.jsonl
    start_at: beginning
    storage: file_storage/checkpoint
    operators:
      - type: json_parser
        parse_from: body
      - type: add
        field: attributes.agent
        value: claude

processors:
  batch: {}

exporters:
  file/logs/claude-hook:
    path: /var/log/otel/claude/hook-logs.jsonl
    append: true
  file/traces/claude:
    path: /var/log/otel/claude/traces.jsonl
    append: true
  file/metrics/claude:
    path: /var/log/otel/claude/metrics.jsonl
    append: true
  file/logs/claude:
    path: /var/log/otel/claude/logs.jsonl
    append: true
  file/traces/githubcopilot:
    path: /var/log/otel/githubcopilot/traces.jsonl
    append: true
  file/metrics/githubcopilot:
    path: /var/log/otel/githubcopilot/metrics.jsonl
    append: true
  file/logs/githubcopilot:
    path: /var/log/otel/githubcopilot/logs.jsonl
    append: true
  otlphttp/ingest:
    endpoint: http://ingest:8080
    encoding: json
    compression: none
  debug:
    verbosity: detailed

connectors:
  routing/logs:
    table:
      - context: resource
        condition: 'resource.attributes["service.name"] == "claude-code"'
        pipelines: [logs/claude]
      - context: resource
        condition: 'resource.attributes["service.name"] == "copilot-chat"'
        pipelines: [logs/githubcopilot]
  routing/metrics:
    table:
      - context: resource
        condition: 'resource.attributes["service.name"] == "claude-code"'
        pipelines: [metrics/claude]
      - context: resource
        condition: 'resource.attributes["service.name"] == "copilot-chat"'
        pipelines: [metrics/githubcopilot]
  routing/traces:
    table:
      - context: resource
        condition: 'resource.attributes["service.name"] == "claude-code"'
        pipelines: [traces/claude]
      - context: resource
        condition: 'resource.attributes["service.name"] == "copilot-chat"'
        pipelines: [traces/githubcopilot]

extensions:
  # Persists filelog read offsets, so a collector restart does not re-read
  # (and, with append: true, re-append) files from the beginning.
  file_storage/checkpoint:
    directory: /var/log/otel/_checkpoints
    create_directory: true

service:
  extensions: [file_storage/checkpoint]
  pipelines:
    logs/claude-hook:
      receivers: [file_log/claude-hook]
      processors: [batch]
      exporters: [file/logs/claude-hook, debug]
    traces/claude:
      receivers: [routing/traces]
      processors: [batch]
      exporters: [file/traces/claude, otlphttp/ingest, debug]
    metrics/claude:
      receivers: [routing/metrics]
      processors: [batch]
      exporters: [file/metrics/claude, debug]
    logs/claude:
      receivers: [routing/logs]
      processors: [batch]
      exporters: [file/logs/claude, otlphttp/ingest, debug]
    traces/githubcopilot:
      receivers: [routing/traces]
      processors: [batch]
      exporters: [file/traces/githubcopilot, otlphttp/ingest, debug]
    metrics/githubcopilot:
      receivers: [routing/metrics]
      processors: [batch]
      exporters: [file/metrics/githubcopilot, debug]
    logs/githubcopilot:
      receivers: [routing/logs]
      processors: [batch]
      exporters: [file/logs/githubcopilot, otlphttp/ingest, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [routing/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [routing/metrics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [routing/traces]
