receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  file_log/claude:
    include:
      - /var/log/claude/hook-log.jsonl
    start_at: beginning
    operators:
      - type: json_parser
        parse_from: body
      - type: add
        field: attributes.agent
        value: claude-code

processors:
  batch: {}

exporters:
  file/traces:
    path: /var/log/otel/githubcopilot/traces.jsonl
  file/metrics:
    path: /var/log/otel/githubcopilot/metrics.jsonl
  file/logs/githubcopilot:
    path: /var/log/otel/githubcopilot/logs.jsonl
  file/logs/claude:
    path: /var/log/otel/claude/logs.jsonl
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs/githubcopilot, debug]
    logs/claude:
      receivers: [file_log/claude]
      processors: [batch]
      exporters: [file/logs/claude, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics, debug]
