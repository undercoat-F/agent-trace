spring.application.name=ingest
server.port=8080

# Overridden by compose (DB_URL=jdbc:mysql://mysql:3306/...). connectionTimeZone=UTC: all stored times are UTC.
# characterEncoding=UTF-8: without it, non-ASCII characters embedded directly in SQL text
# (not bound as a PreparedStatement parameter) can get corrupted round-tripping through
# this connection, even though the utf8mb4 columns and bound parameters are unaffected.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agent_trace?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:agenttrace}
spring.datasource.password=${DB_PASSWORD:agenttrace}

# The schema lives in the core module (classpath:db/migration). Only ingest migrates.
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# Jev (docs.typesafe.ai). jev.api-key comes from compose's JEV_API_KEY, itself
# from the root .env's jevkey via Compose's own .env substitution — never
# hardcode a real key here. Empty default: JevClient degrades to unavailable
# rather than failing ingest's startup when it's unset.
jev.base-url=${JEV_BASE_URL:https://api.typesafe.ai/v1/systemone}
jev.api-key=${JEV_API_KEY:}
jev.model=${JEV_MODEL:jev-latest}
