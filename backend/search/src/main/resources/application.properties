spring.application.name=search
server.port=8080

# Same database as ingest; connectionTimeZone=UTC because all stored times are UTC.
# TODO: switch to a read-only DB user once search has real endpoints.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agent_trace?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:agenttrace}
spring.datasource.password=${DB_PASSWORD:agenttrace}

management.endpoints.web.exposure.include=health
