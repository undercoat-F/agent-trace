spring.application.name=search
server.port=8080

# Same database as ingest, but a read-only user (search has no write path).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agent_trace?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:agenttrace_ro}
spring.datasource.password=${DB_PASSWORD}

ui.origin=${UI_ORIGIN:http://localhost:5173}

management.endpoints.web.exposure.include=health
