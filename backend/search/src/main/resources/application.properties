spring.application.name=search
server.port=8080

# Same database as ingest, but a read-only user (search has no write path).
# characterEncoding=UTF-8: see the same note in ingest's application.properties.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agent_trace?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:agenttrace_ro}
spring.datasource.password=${DB_PASSWORD}

ui.origin=${UI_ORIGIN:http://localhost:5173}

management.endpoints.web.exposure.include=health
